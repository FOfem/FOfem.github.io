# Updated 20260802

name: ForraCorp Live Pipeline

on:
  schedule:
    - cron: '0 0,3,6,9,12,15,18,21 * * *' # Runs automatically at midnight
  workflow_dispatch:  # Allows manual triggers via the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    # Grant write permissions to push `last_run.json` updates back to the repo
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies & Playwright Browsers
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          python -m playwright install --with-deps chromium

      - name: Execute ForraCorp Crawler (Intelligence Engine)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python crawler_script.py

      - name: Sync Data to Repository
        run: |
          git config --global user.name 'Ubi-Fredrick-Bot'
          git config --global user.email 'forracorp1@gmail.com'
          git add last_run.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Live Update: $(date)" && git push)
